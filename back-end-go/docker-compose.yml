name: nutrisafe

services:
  db:
    image: postgres:15-alpine
    container_name: nutrisafe-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data 

  ml-service:
    build:
      context: ../../NutritionModel
      dockerfile: Dockerfile
    container_name: nutrisafe-ml
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ../../NutritionModel/.env
    # Mount api.py dari host → edit langsung apply tanpa rebuild image.
    volumes:
      - ../../NutritionModel/api.py:/app/api.py
    # --reload: uvicorn watch api.py, auto-restart saat file berubah.
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --reload

  backend:
    build: .
    container_name: nutrisafe-backend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST}
      DB_PASSWORD: ${DB_PASSWORD}
      ML_SERVICE_URL: http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata: