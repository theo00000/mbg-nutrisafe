# Reverse proxy host-level untuk NutriSafe.
# Pasang ke /etc/nginx/sites-available/nutrisafe.conf lalu symlink ke sites-enabled.
#
# File ini versi HTTP-only. Jalankan certbot --nginx SETELAH ini aktif;
# certbot yang akan menambahkan listen 443 + sertifikat + redirect otomatis.

# --- FE user: nutrisafe.id + www ---
server {
    listen 80;
    listen [::]:80;
    server_name nutrisafe.id www.nutrisafe.id;

    # Import Excel siswa bisa >1MB. Default nginx 1m terlalu kecil.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# --- FE admin: admin.nutrisafe.id ---
server {
    listen 80;
    listen [::]:80;
    server_name admin.nutrisafe.id;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# --- Backend Go: api.nutrisafe.id ---
server {
    listen 80;
    listen [::]:80;
    server_name api.nutrisafe.id;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Deteksi makanan lewat ML bisa lama. Jangan putus di 60s default.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# --- Akses via IP mentah: tolak, jangan bocorkan app ---
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
